{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: connect-gateway-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connect-gateway.labels" (dict "component" "connect-gateway" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "connect-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
