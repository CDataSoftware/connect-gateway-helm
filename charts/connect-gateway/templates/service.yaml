apiVersion: v1
kind: Service
metadata:
  name: connect-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connect-gateway.labels" (dict "component" "connect-gateway" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "connect-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.containerPort }}
      protocol: TCP
