{{- if .Values.gateway.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connect-gateway.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connect-gateway.labels" (dict "component" "connect-gateway" "context" .) | nindent 4 }}
type: Opaque
stringData:
  gateway-api-key: {{ .Values.gateway.apiKey | quote }}
{{- end }}
